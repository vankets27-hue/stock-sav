<title>Stock Véhicule</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--accent:#2563eb;--danger:#dc2626;--ok:#059669;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.7}
main{max-width:900px;margin:auto;padding:14px 14px 95px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 1px 2px #00000008}
.stat b{font-size:25px;display:block}.stat span,.muted{font-size:12px;color:var(--muted)}
input,select,button.action{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:16px}
button.primary{background:var(--accent);color:#fff;border:0}button.danger{background:var(--danger);color:#fff;border:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:650}.qty{font-size:20px;font-weight:800;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}
.low{color:#b45309}.zero{color:var(--danger)}.ok{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;font-size:11px;color:var(--muted);padding:5px}nav button.active{color:var(--accent);font-weight:700}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
#reader{width:100%;min-height:260px;background:#111;border-radius:14px;overflow:hidden}#reader video{width:100%!important;height:auto!important}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:999px;z-index:50;font-size:14px}
</style></head>

function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),1800)}
function threshold(x){return Number(state.thresholds[x.sap]??0)}
function itemHtml(x){let q=Number(x.qty),th=threshold(x),cls=q<=0?"zero":q<=th?"low":"ok";return `<div class="item card"><div onclick="openItem('${esc(x.sap)}')"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.sap)} · <span class="badge">${esc(x.unit)}</span></div></div><div class="qty ${cls}">${fmtQty(q,x.unit)}</div></div>`}
function historyHtml(h){let sign=h.type==="out"?"➖":"➕";return `<div class="item card" onclick="showHistory(${state.history.indexOf(h)})"><div><div class="name">${sign} ${esc(h.name)}</div><div class="muted">${esc(h.sap)} · ${esc(h.reason||"")}${h.order?` · OT/Commande : ${esc(h.order)}`:""}${h.client?` · Client : ${esc(h.client)}`:""} · ${new Date(h.date).toLocaleString("fr-FR")}</div></div><div class="qty">${h.type==="out"?"-":"+"}${fmtQty(h.qty,h.unit)} ${esc(h.unit)}</div></div>`}
function showHistory(i){let h=state.history[i];if(!h)return;document.getElementById("sheet").innerHTML=`<h2>${h.type==="out"?"➖ Sortie":"➕ Réception"}</h2><div class="name">${esc(h.name)}</div><div class="muted">SAP : ${esc(h.sap)} · ${esc(h.unit)}</div><hr><p><b>Quantité :</b> ${h.type==="out"?"-":"+"}${fmtQty(h.qty,h.unit)} ${esc(h.unit)}</p><p><b>Date :</b> ${new Date(h.date).toLocaleString("fr-FR")}</p><p><b>Motif :</b> ${esc(h.reason||"-")}</p><p><b>OT / Commande :</b> ${esc(h.order||"-")}</p><p><b>Client :</b> ${esc(h.client||"-")}</p><br><button class="action" onclick="closeModal()">Fermer</button>`;document.getElementById("modal").classList.remove("hidden")}

const views={
home:()=>{let total=state.items.reduce((s,x)=>s+Number(x.qty),0),zero=state.items.filter(x=>Number(x.qty)<=0).length,low=state.items.filter(x=>Number(x.qty)>0&&Number(x.qty)<=threshold(x)).length;let alerts=state.items.filter(x=>Number(x.qty)>0&&Number(x.qty)<=threshold(x));return `<div class="grid"><div class="card stat"><b>${state.items.length}</b><span>Références</span></div><div class="card stat"><b>${total.toLocaleString("fr-FR")}</b><span>Quantités en stock</span></div><div class="card stat" onclick="openStockFilter('rupture')" style="cursor:pointer"><b class="zero">${zero}</b><span>En rupture</span></div><div class="card stat"><b class="low">${low}</b><span>Sous seuil</span></div></div><div class="card"><h3>Actions rapides</h3><div class="row"><button class="action primary" onclick="tab='scan';render()">📷 Scanner</button><button class="action" onclick="openAdd()">➕ Ajouter</button></div></div><div class="card"><h3>Stock à surveiller</h3>${alerts.slice(0,8).map(itemHtml).join("")||'<div class="muted">Aucune alerte 🎉</div>'}${alerts.length>8?`<p class="muted">+ ${alerts.length-8} autre(s) dans le Stock.</p>`:""}</div><div class="card"><h3>🕘 Mouvements récents</h3>${state.history.slice(-5).reverse().map(historyHtml).join("")||'<div class="muted">Aucun mouvement.</div>'}</div>`},
stock:()=>`<div class="card"><div class="row"><input id="q" placeholder="🔎 Nom ou code SAP..." oninput="renderStock()"><button class="action" onclick="stockFilter='';openAdd()">➕</button></div>${stockFilter?`<div class="muted" style="margin:8px 0">Filtre : ${stockFilter==="rupture"?"🔴 En rupture":"🟠 Sous seuil"} · <button class="action" onclick="stockFilter='';renderStock()">Afficher tout</button></div>`:""}<div id="stockList"></div></div>`,
scan:()=>`<div class="card"><h2>📷 Scanner un code SAP</h2><div id="reader"></div><p class="muted">Lecture des codes-barres/QR. Si le SAP est uniquement imprimé en chiffres, utilise la saisie manuelle.</p><div class="row"><input id="manualSap" inputmode="numeric" placeholder="Code SAP"><button class="action primary" onclick="findSap()">Rechercher</button></div></div>`,
history:()=>`<div class="card"><h2>🕘 Historique</h2>${state.history.slice().reverse().map(historyHtml).join("")||'<div class="muted">Aucun mouvement.</div>'}</div>`,
more:()=>`<div class="card"><h2>⚙️ Gestion</h2><p class="muted">Stock SAV · V${APP_VERSION}</p><button class="action" onclick="exportCSV()">📤 Exporter le stock en CSV</button><br><br><button class="action" onclick="exportHistory()">🧾 Exporter l'historique</button><br><br><button class="action" onclick="exportBackup()">💾 Sauvegarder toutes les données</button><br><br><label class="action" for="backupFile" style="display:block;text-align:center;cursor:pointer">♻️ Restaurer une sauvegarde</label><input id="backupFile" type="file" accept="application/json,.json" style="margin-top:8px" onchange="importBackup(this.files[0])"><br><br><button class="action" onclick="document.getElementById('file').click()">📥 Importer Excel/CSV</button><input id="file" type="file" accept=".xlsx,.xls,.csv,.ods" class="hidden" onchange="importFile(this.files[0])"><br><br><button class="action danger" onclick="resetData()">Réinitialiser avec l'inventaire d'origine</button></div><div class="card"><h3>💾 Données</h3><p class="muted">V4.2.3 · Les données sont enregistrées sur cet appareil. La sauvegarde JSON conserve le stock, l’historique et les seuils et permet de restaurer une V4/V4.2.</p></div>`
};
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("app").innerHTML=views[tab]();if(tab==="stock")renderStock();if(tab==="scan")initScanner()}
function sapCompare(a,b){
  const A=String(a.sap||"").trim(), B=String(b.sap||"").trim();
  const na=Number(A.replace(",",".")), nb=Number(B.replace(",","."));
  if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
  return A.localeCompare(B,"fr",{numeric:true,sensitivity:"base"});
}
function renderStock(){
  let q=(document.getElementById("q")?.value||"").toLowerCase();
  let items=state.items.filter(x=>x.sap.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
  if(stockFilter==="rupture") items=items.filter(x=>Number(x.qty)<=0);
  if(stockFilter==="seuil") items=items.filter(x=>Number(x.qty)>0&&Number(x.qty)<=threshold(x));
  items.sort(sapCompare);
  document.getElementById("stockList").innerHTML=items.map(itemHtml).join("")||'<div class="muted">Aucun article trouvé.</div>';
}
function openStockFilter(filter){stockFilter=filter;tab="stock";render();}
function openItem(sap){let x=state.items.find(x=>x.sap===sap);if(!x)return;document.getElementById("sheet").innerHTML=`<h2>${esc(x.name)}</h2><div class="muted">SAP : ${esc(x.sap)} · Unité : ${esc(x.unit)}</div><h1>${fmtQty(x.qty,x.unit)} ${esc(x.unit)}</h1><div class="row"><button class="action danger" onclick="move('${x.sap}','out')">➖ Utiliser</button><button class="action primary" onclick="move('${x.sap}','in')">➕ Réception</button></div><br><label>Seuil d'alerte</label><input id="th" type="number" min="0" step="any" value="${threshold(x)}"><br><br><button class="action primary" onclick="setThreshold('${x.sap}')">Enregistrer le seuil</button><br><br><button class="action" onclick="closeModal()">Fermer</button>`;document.getElementById("modal").classList.remove("hidden")}
function move(sap,type){let x=state.items.find(x=>x.sap===sap);document.getElementById("sheet").innerHTML=`<h2>${type==="out"?"➖ Utiliser une pièce":"➕ Réception"}</h2><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.sap)} · stock actuel : ${fmtQty(x.qty,x.unit)} ${esc(x.unit)}</div><br><label>Quantité</label><input id="mvqty" type="number" min="0.0001" step="${decimals(x.unit)?"0.01":"1"}" value="1"><br><label>Motif</label><select id="reason"><option>Intervention</option><option>Réapprovisionnement</option><option>Pièce défectueuse</option><option>Casse / perte</option><option>Retour fournisseur</option><option>Autre</option></select><br><label>OT / Commande ${type==="out"?"*":""}</label><input id="order" placeholder="Ex. 45001234"><br><label>Client ${type==="out"?"*":""}</label><input id="client" placeholder="Nom du client"><br><br><div class="row"><button class="action primary" onclick="commitMove('${sap}','${type}')">Valider</button><button class="action" onclick="closeModal()">Annuler</button></div>`;document.getElementById("modal").classList.remove("hidden")}
function commitMove(sap,type){let x=state.items.find(x=>x.sap===sap),q=Number(document.getElementById("mvqty").value),order=document.getElementById("order").value.trim(),client=document.getElementById("client").value.trim();if(!q||q<0)return toast("Quantité invalide");if(type==="out"&&q>x.qty)return toast("Stock insuffisant");if(type==="out"&&(!order||!client))return toast("OT/Commande et client obligatoires");x.qty=Number(x.qty)+(type==="out"?-q:q);state.history.push({date:new Date().toISOString(),sap,name:x.name,unit:x.unit,qty:q,type,reason:document.getElementById("reason").value,order,client});save();closeModal();toast(type==="out"?"Sortie enregistrée":"Réception enregistrée");render()}
function setThreshold(sap){state.thresholds[sap]=Number(document.getElementById("th").value)||0;save();toast("Seuil enregistré")}
function openAdd(prefill=""){document.getElementById("sheet").innerHTML=`<h2>➕ Nouvel article</h2><label>Code SAP</label><input id="nsap" inputmode="numeric" value="${esc(prefill)}"><br><label>Désignation</label><input id="nname"><br><label>Quantité initiale</label><input id="nqty" type="number" step="any" value="0"><br><label>Unité</label><input id="nunit" value="PCE"><br><br><button class="action primary" onclick="addItem()">Créer</button><br><br><button class="action" onclick="closeModal()">Annuler</button>`;document.getElementById("modal").classList.remove("hidden")}
function addItem(){let sap=document.getElementById("nsap").value.trim(),name=document.getElementById("nname").value.trim();if(!sap||!name)return toast("SAP et désignation obligatoires");if(state.items.some(x=>x.sap===sap))return openItem(sap);state.items.push({sap,name,qty:Number(document.getElementById("nqty").value)||0,unit:document.getElementById("nunit").value.trim()||"PCE"});state.items.sort(sapCompare);save();closeModal();toast("Article créé");render()}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function findSap(){let s=document.getElementById("manualSap").value.trim();if(!s)return;if(state.items.some(x=>x.sap===s))openItem(s);else openAdd(s)}
function initScanner(){if(scanner)return;scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:250},code=>{scanner.stop().then(()=>{scanner=null;if(state.items.some(x=>x.sap===code))openItem(code);else openAdd(code)})}).catch(()=>toast("Autorisez l'accès à la caméra"))}
function downloadCSV(rows,name){let csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(";")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click()}
function exportCSV(){downloadCSV([["Code SAP","Désignation","Quantité","Unité"],...state.items.map(x=>[x.sap,x.name,x.qty,x.unit])],"stock_vehicule.csv")}
function exportHistory(){downloadCSV([["Date","Type","Code SAP","Désignation","Quantité","Unité","Motif"],...state.history.map(h=>[h.date,h.type,h.sap,h.name,h.qty,h.unit,h.reason])],"historique_stock.csv")}
function importFile(file){if(!file)return;let r=new FileReader();r.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}),head=rows.shift().map(v=>String(v).toLowerCase()),ia=head.findIndex(x=>x.includes("article")||x.includes("sap")),inm=head.findIndex(x=>x.includes("désignation")||x.includes("designation")),iq=head.findIndex(x=>x.includes("quant")),iu=head.findIndex(x=>x.includes("unit"));let n=0;rows.forEach(row=>{let sap=String(row[ia]??"").replace(/\.0$/,"").trim(),name=String(row[inm]??"").trim();if(!sap||!name)return;let q=Number(String(row[iq]??0).replace(",","."))||0,unit=String(row[iu]??"PCE").trim()||"PCE",x=state.items.find(x=>x.sap===sap);if(x)x.qty=q;else state.items.push({sap,name,qty:q,unit});n++});save();tab="stock";render();toast(n+" lignes importées")}catch(err){toast("Import impossible")}};r.readAsArrayBuffer(file)}
function exportBackup(){let blob=new Blob([JSON.stringify({app:"Stock SAV",version:APP_VERSION,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="stock_sav_backup.json";a.click()}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const raw=String(e.target.result||"").replace(/^\uFEFF/,"").trim();
      const b=JSON.parse(raw);
      let src=b&&b.state?b.state:(b&&b.data?b.data:b);
      if(!src||!Array.isArray(src.items)) throw Error("items");
      const items=src.items.map(x=>({
        sap:String(x.sap??x.SAP??x.code??x.codeSAP??"").trim(),
        name:String(x.name??x.designation??x.designation??"").trim(),
        qty:Number(String(x.qty??x.quantity??0).replace(",","."))||0,
        unit:String(x.unit??"PCE").trim()||"PCE"
      })).filter(x=>x.sap&&x.name);
      if(!items.length) throw Error("empty");
      const history=Array.isArray(src.history)?src.history.map(h=>({...h,order:h.order||"",client:h.client||""})):[];
      const thresholds=src.thresholds&&typeof src.thresholds==="object"?src.thresholds:{};
      if(!confirm("Restaurer cette sauvegarde ? Les données actuellement affichées seront remplacées."))return;
      state={...src,items,history,thresholds,version:APP_VERSION};
      state.items.sort(sapCompare);
      save();
      stockFilter="";tab="home";render();
      toast("Sauvegarde restaurée : "+state.items.length+" articles / "+state.history.length+" mouvements");
    }catch(err){
      console.error(err);
      toast("Sauvegarde invalide : sélectionne le fichier stock_sav_backup.json créé par l'application");
    }
  };
  r.readAsText(file);
}
function resetData(){if(confirm("Réinitialiser avec l'inventaire d'origine ? Les mouvements seront supprimés.")){state={items:INITIAL.map(x=>({...x,qty:Number(x.qty)})),history:[],thresholds:{},version:APP_VERSION};save();render();toast("Stock réinitialisé")}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(scanner){scanner.stop().catch(()=>{});scanner=null}render()});
render();
</script></body></html>
