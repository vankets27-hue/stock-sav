<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock SAV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stock SAV — Weiss Technik</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--blue:#1769e0;--blue2:#0f4fb8;--green:#137a45;--red:#b42318;--amber:#b54708;--nav:#fff;--shadow:0 6px 22px rgba(16,24,40,.08);--radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:pan-y}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;padding-bottom:92px}.top{background:linear-gradient(135deg,#0e1728,#18253b);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 20px;position:sticky;top:0;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.12)}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:46px;height:46px;border:2px solid rgba(255,255,255,.85);border-radius:13px;display:grid;place-items:center;font-weight:900;letter-spacing:-2px;font-size:19px;background:rgba(255,255,255,.08)}.brand h1{font-size:20px;margin:0;letter-spacing:.2px}.brand p{margin:2px 0 0;color:#cbd5e1;font-size:13px}.wrap{max-width:820px;margin:0 auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid rgba(16,24,40,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.hero{display:flex;align-items:flex-end;justify-content:space-between}.hero .num{font-size:46px;font-weight:800;line-height:1}.label{color:var(--muted);font-size:14px}.muted{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.action{min-height:72px;border-radius:18px;padding:13px 14px;font-weight:750;text-align:left;display:flex;gap:10px;align-items:center}.action .ico{font-size:25px}.primary{background:var(--blue);color:#fff}.dark{background:#111827;color:#fff}.green{background:#e9f8ef;color:#086b3b;border:1px solid #bfe8cf}.red{background:#fff0ef;color:#a31c15;border:1px solid #f1c0bb}.alert{display:flex;align-items:center;justify-content:space-between;gap:12px}.alert.click{cursor:pointer}.alert .big{font-size:32px;font-weight:800}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef2f6;color:#344054;font-size:12px;font-weight:700}.list{display:flex;flex-direction:column;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row.click{cursor:pointer}.row .sap{font-weight:800;font-variant-numeric:tabular-nums}.row .name{color:#475467;font-size:14px;margin-top:3px}.qty{font-size:20px;font-weight:800;white-space:nowrap}.danger{color:var(--red)}.ok{color:var(--green)}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;border:1px dashed #cfd5dd}.search{display:flex;gap:8px;margin-bottom:12px}.search input,.field input,.field select{width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:14px;padding:13px 14px;outline:none}.search input:focus,.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}.seg{display:flex;background:#e9edf2;border-radius:14px;padding:3px;margin-bottom:12px}.seg button{flex:1;background:transparent;padding:10px;border-radius:11px;color:#475467;font-weight:700}.seg button.active{background:#fff;color:#111827;box-shadow:0 1px 4px rgba(0,0,0,.08)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr)}.navbtn{background:none;color:#667085;padding:7px 4px;font-size:11px;font-weight:700}.navbtn .nicon{display:block;font-size:22px;margin-bottom:2px}.navbtn.active{color:#111827}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease}.sheet h2{margin:0 0 5px;font-size:21px}.close{float:right;background:#eef2f6;border-radius:50%;width:36px;height:36px;font-size:20px}.detail-head{padding-right:44px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;color:#475467;margin-bottom:6px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigbtn{width:100%;padding:14px;border-radius:15px;font-weight:800;margin-top:8px}.bluebtn{background:var(--blue);color:#fff}.greenbtn{background:#147a45;color:#fff}.redbtn{background:#b42318;color:#fff}.secondary{background:#eef2f6;color:#344054}.history-item{border-left:4px solid #98a2b3;padding:10px 12px;margin:8px 0;background:#f8fafc;border-radius:0 12px 12px 0}.history-item.in{border-color:#12b76a}.history-item.out{border-color:#f04438}.history-item .meta{font-size:12px;color:#667085;margin-top:4px}.camera{background:#0b1220;border-radius:18px;overflow:hidden}.camera video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.camera .camcontrols{padding:10px;display:flex;gap:8px}.toast{position:fixed;left:16px;right:16px;bottom:92px;background:#111827;color:#fff;padding:13px 15px;border-radius:14px;z-index:80;box-shadow:var(--shadow);display:none}.toast.show{display:block}.small{font-size:13px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}.section-title h2{font-size:18px;margin:0}.backline{display:flex;align-items:center;gap:8px;margin-bottom:12px}.backline button{background:#eef2f6;padding:8px 11px;border-radius:10px;font-weight:700}.footer-note{font-size:12px;color:#667085;text-align:center;margin:18px 0}.file{display:none}@keyframes up{from{transform:translateY(20px);opacity:.7}to{transform:none;opacity:1}}
@media(min-width:700px){.top{position:relative}.bottom{max-width:820px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}.wrap{padding:22px}.sheet{max-width:650px;margin:auto;border-radius:24px;margin-bottom:20px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
const INITIAL_URL='./inventory.json';
const KEY='stockSAVV4';
let state={items:[],moves:[],page:'home',query:'',stockFilter:'all',selected:null};
let cameraStream=null;
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function decUnit(unit){return ['L','KG','KGS','M','ML','LITRE','LITRES','METRE','METRES'].includes((unit||'').toUpperCase())}
function fmtQty(n,unit){n=Number(n)||0; return decUnit(unit)?n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(n).toLocaleString('fr-FR')}
function normUnit(u){u=(u||'PCE').toUpperCase().trim(); if(u==='M.')u='M'; return u}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)); if(x&&Array.isArray(x.items)){state=x; state.page='home'; render(); return}}catch(e){} fetch(INITIAL_URL).then(r=>r.json()).then(items=>{state.items=items.map(x=>({...x,qty:Number(x.qty)||0,threshold:Number(x.threshold)||0,unit:normUnit(x.unit)}));save();render()}).catch(()=>{state.items=[];render()})}
function save(){localStorage.setItem(KEY,JSON.stringify({items:state.items,moves:state.moves}))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function lowItems(){return state.items.filter(x=>Number(x.threshold)>0&&Number(x.qty)<=Number(x.threshold))}
function find(sap){return state.items.find(x=>x.sap===String(sap).trim())}
function nav(page){state.page=page;state.query='';render();scrollTo(0,0)}
function render(){
 const body=state.page==='home'?home():state.page==='stock'?stock():state.page==='scanner'?scanner():more();
 $('#app').innerHTML=`<header class="top"><div class="brand"><div class="brandmark">WT</div><div><h1>WEISS TECHNIK</h1><p>Stock SAV · gestion hors connexion</p></div></div></header><main class="wrap">${body}</main><nav class="bottom">${navBtn('home','🏠','Accueil')}${navBtn('scanner','📷','Scanner')}${navBtn('stock','📦','Stock')}${navBtn('more','⚙️','Plus')}</nav>`;
}
function navBtn(id,ico,label){return `<button class="navbtn ${state.page===id?'active':''}" onclick="nav('${id}')"><span class="nicon">${ico}</span>${label}</button>`}
function home(){const low=lowItems();const recent=state.moves.slice().reverse().slice(0,5);const total=state.items.reduce((a,x)=>a+Number(x.qty||0),0);return `<section class="card hero"><div><div class="label">Références</div><div class="num">${state.items.length}</div></div><div style="text-align:right"><div class="label">Total unités</div><b>${total.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})}</b></div></section><div class="actions"><button class="action primary" onclick="nav('scanner')"><span class="ico">📷</span><span>Scanner SAP<br><small>ou saisir une référence</small></span></button><button class="action dark" onclick="nav('stock')"><span class="ico">📦</span><span>Voir le stock<br><small>toutes les références</small></span></button></div><section class="card alert click" onclick="showLow()"><div><div class="label">⚠️ Seuils d’alerte</div><div class="big">${low.length}</div><div class="muted">article(s) à contrôler</div></div><div style="font-size:24px">›</div></section><div class="section-title"><h2>Derniers mouvements</h2><button class="pill" onclick="nav('more')">Tout voir</button></div>${recent.length?`<div class="list">${recent.map(movementRow).join('')}</div>`:`<div class="empty">Aucun mouvement enregistré.</div>`}<div class="footer-note">Les données sont stockées sur cet appareil.</div>`}
function movementRow(m){const it=find(m.sap)||{name:m.name||'',unit:m.unit||''};return `<div class="row click" onclick="showMove('${m.id}')"><div><div class="sap">${m.type==='in'?'➕':'➖'} ${esc(m.sap)}</div><div class="name">${esc(it.name)} · ${esc(m.dateDisplay||m.date)}</div></div><div class="qty ${m.type==='in'?'ok':'danger'}">${m.type==='in'?'+':'−'}${fmtQty(m.qty,it.unit||m.unit)}</div></div>`}
function stock(){let q=state.query.toLowerCase();let arr=state.items.filter(x=>!q||x.sap.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));if(state.stockFilter==='low')arr=arr.filter(x=>Number(x.threshold)>0&&Number(x.qty)<=Number(x.threshold));return `<div class="search"><input id="stockSearch" value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Rechercher SAP ou désignation…"></div><div class="seg"><button class="${state.stockFilter==='all'?'active':''}" onclick="state.stockFilter='all';render()">Tous</button><button class="${state.stockFilter==='low'?'active':''}" onclick="state.stockFilter='low';render()">Alertes (${lowItems().length})</button></div><div class="list">${arr.length?arr.map(itemRow).join(''):`<div class="empty">Aucun article trouvé.</div>`}</div>`}
function itemRow(x){const low=Number(x.threshold)>0&&Number(x.qty)<=Number(x.threshold);return `<div class="row click" onclick="showItem('${x.sap}')"><div style="min-width:0"><div class="sap">${esc(x.sap)} ${low?'⚠️':''}</div><div class="name">${esc(x.name)}</div></div><div style="text-align:right"><div class="qty ${x.qty<=0?'danger':low?'danger':'ok'}">${fmtQty(x.qty,x.unit)}</div><span class="pill">${esc(x.unit)}</span></div></div>`}
function scanner(){return `<section class="card"><h2 style="margin:0 0 6px">Scanner SAP</h2><p class="muted small">Le numéro SAP est imprimé sur la pièce. Tu peux le saisir ici ou utiliser la caméra pour cadrer la référence.</p><div class="field"><label>Numéro SAP</label><input id="sapInput" inputmode="numeric" placeholder="Ex. 60887010" onkeydown="if(event.key==='Enter')openSap()"></div><button class="bigbtn bluebtn" onclick="openSap()">Ouvrir la référence</button><button class="bigbtn secondary" onclick="startCamera()">📷 Ouvrir la caméra</button><div id="camArea" style="margin-top:12px"></div></section><section class="card" style="margin-top:12px"><b>Astuce iPhone</b><p class="muted small">Si tu es hors connexion et que la reconnaissance automatique n’est pas disponible, utilise le texte détecté par l’appareil photo / Live Text puis colle le SAP ci-dessus.</p></section>`}
function more(){return `<section class="card"><div class="section-title" style="margin-top:0"><h2>Données</h2></div><button class="bigbtn secondary" onclick="backup()">💾 Sauvegarder les données</button><button class="bigbtn secondary" onclick="document.querySelector('#restoreFile').click()">↩️ Restaurer une sauvegarde JSON</button><input class="file" id="restoreFile" type="file" accept="application/json,.json" onchange="restore(event)"><button class="bigbtn secondary" onclick="exportCSV()">📤 Exporter le stock en CSV</button><button class="bigbtn secondary" onclick="document.querySelector('#csvFile').click()">📥 Importer un stock CSV</button><input class="file" id="csvFile" type="file" accept=".csv,text/csv" onchange="importCSV(event)"></section><section class="card" style="margin-top:12px"><div class="section-title" style="margin-top:0"><h2>Mouvements</h2></div>${state.moves.length?`<div class="list">${state.moves.slice().reverse().map(movementRow).join('')}</div>`:`<div class="empty">Aucun mouvement.</div>`}</section><section class="card" style="margin-top:12px"><h2 style="margin-top:0">À propos</h2><p class="muted small">Stock SAV · Weiss Technik<br>Version 4 · données locales, utilisable hors connexion après chargement.</p></section>`}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show');$('#modal').setAttribute('aria-hidden','false')}
function closeModal(){stopCamera();$('#modal').classList.remove('show');$('#modal').setAttribute('aria-hidden','true')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function showLow(){const low=lowItems();openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><h2>⚠️ Articles à contrôler</h2><p class="muted">Seuil supérieur à 0 et stock inférieur ou égal au seuil.</p></div>${low.length?`<div class="list">${low.map(x=>itemRow(x)).join('')}</div>`:`<div class="empty">Aucun article au seuil.</div>`}`)}
function showItem(sap){const x=find(sap);if(!x)return;openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><div class="label">Référence SAP</div><h2>${esc(x.sap)}</h2><p>${esc(x.name)}</p></div><section class="card" style="box-shadow:none;border:1px solid var(--line);padding:15px"><div class="label">Stock actuel</div><div style="font-size:38px;font-weight:850">${fmtQty(x.qty,x.unit)} <span style="font-size:16px;color:#667085">${esc(x.unit)}</span></div><div class="twocol" style="margin-top:12px"><div><div class="label">Seuil d’alerte</div><b>${fmtQty(x.threshold,x.unit)}</b></div><div><div class="label">Unité</div><b>${esc(x.unit)}</b></div></div></section><button class="bigbtn greenbtn" onclick="showMoveForm('${x.sap}','in')">➕ Ajouter du stock</button><button class="bigbtn redbtn" onclick="showMoveForm('${x.sap}','out')">➖ Utiliser du stock</button><button class="bigbtn secondary" onclick="editItem('${x.sap}')">✏️ Modifier l’article / le seuil</button><button class="bigbtn secondary" onclick="showHistory('${x.sap}')">📜 Voir l’historique</button>`)}
function showMoveForm(sap,type){const x=find(sap);const title=type==='in'?'Ajouter du stock':'Utiliser du stock';openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><div class="label">${esc(x.sap)}</div><h2>${title}</h2><p>${esc(x.name)}</p></div><div class="field"><label>Quantité (${esc(x.unit)})</label><input id="moveQty" type="number" min="0" step="${decUnit(x.unit)?'0.01':'1'}" inputmode="decimal" placeholder="0${decUnit(x.unit)?',00':''}"></div>${type==='out'?`<div class="field"><label>Nº d’ordre *</label><input id="orderNo" inputmode="text" placeholder="Nº d’ordre"></div><div class="field"><label>Nom du client *</label><input id="clientName" placeholder="Nom du client"></div>`:`<div class="field"><label>Commentaire (facultatif)</label><input id="comment" placeholder="Ex. réapprovisionnement"></div>`}<button class="bigbtn ${type==='in'?'greenbtn':'redbtn'}" onclick="commitMove('${x.sap}','${type}')">Valider</button>`)}
function commitMove(sap,type){const x=find(sap);let q=parseFloat(String($('#moveQty').value).replace(',','.'));if(!Number.isFinite(q)||q<=0)return toast('Saisis une quantité valide.');if(type==='out'&&q>x.qty)return toast('Stock insuffisant.');if(type==='out'){const order=$('#orderNo').value.trim(),client=$('#clientName').value.trim();if(!order||!client)return toast('Nº d’ordre et client obligatoires.')}x.qty=Number((x.qty+(type==='in'?q:-q)).toFixed(decUnit(x.unit)?2:0));const now=new Date();const m={id:uid(),sap:x.sap,name:x.name,unit:x.unit,type,qty:q,date:now.toISOString(),dateDisplay:now.toLocaleString('fr-FR'),order:type==='out'?$('#orderNo').value.trim():'',client:type==='out'?$('#clientName').value.trim():'',comment:type==='in'?($('#comment')?.value.trim()||''):''};state.moves.push(m);save();closeModal();toast(type==='in'?'Entrée enregistrée.':'Utilisation enregistrée.');render()}
function showHistory(sap){const x=find(sap);const ms=state.moves.filter(m=>m.sap===sap).slice().reverse();openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><div class="label">Historique</div><h2>${esc(x.sap)}</h2><p>${esc(x.name)}</p></div>${ms.length?ms.map(m=>`<div class="history-item ${m.type}"><b>${m.type==='in'?'➕ Entrée':'➖ Utilisation'} · ${fmtQty(m.qty,x.unit)} ${esc(x.unit)}</b><div class="meta">${esc(m.dateDisplay||m.date)}${m.order?` · Ordre : ${esc(m.order)}`:''}${m.client?` · Client : ${esc(m.client)}`:''}${m.comment?` · ${esc(m.comment)}`:''}</div></div>`).join(''):`<div class="empty">Aucun mouvement pour cet article.</div>`}`)}
function showMove(id){const m=state.moves.find(x=>x.id===id);if(!m)return;const x=find(m.sap)||m;openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><div class="label">Détail du mouvement</div><h2>${m.type==='in'?'➕ Entrée':'➖ Utilisation'}</h2><p>${esc(m.sap)} · ${esc(x.name||m.name)}</p></div><section class="card" style="box-shadow:none;border:1px solid var(--line);padding:15px"><p><b>Quantité :</b> ${m.type==='in'?'+':'−'}${fmtQty(m.qty,x.unit||m.unit)} ${esc(x.unit||m.unit)}</p><p><b>Date :</b> ${esc(m.dateDisplay||m.date)}</p>${m.order?`<p><b>Nº d’ordre :</b> ${esc(m.order)}</p>`:''}${m.client?`<p><b>Client :</b> ${esc(m.client)}</p>`:''}${m.comment?`<p><b>Commentaire :</b> ${esc(m.comment)}</p>`:''}</section>`)}
function editItem(sap){const x=find(sap);openModal(`<button class="close" onclick="closeModal()">×</button><div class="detail-head"><div class="label">Modifier</div><h2>${esc(x.sap)}</h2><p>${esc(x.name)}</p></div><div class="field"><label>Stock actuel (${esc(x.unit)})</label><input id="editQty" type="number" step="${decUnit(x.unit)?'0.01':'1'}" value="${String(x.qty).replace('.',',')}" inputmode="decimal"></div><div class="field"><label>Seuil d’alerte (${esc(x.unit)})</label><input id="editThreshold" type="number" min="0" step="${decUnit(x.unit)?'0.01':'1'}" value="${String(x.threshold).replace('.',',')}" inputmode="decimal"></div><button class="bigbtn bluebtn" onclick="saveItemEdit('${x.sap}')">Enregistrer</button>`)}
function saveItemEdit(sap){const x=find(sap);const q=parseFloat($('#editQty').value.replace(',','.')),t=parseFloat($('#editThreshold').value.replace(',','.'));if(!Number.isFinite(q)||q<0||!Number.isFinite(t)||t<0)return toast('Valeurs invalides.');x.qty=Number(q.toFixed(decUnit(x.unit)?2:0));x.threshold=Number(t.toFixed(decUnit(x.unit)?2:0));save();closeModal();toast('Article mis à jour.');render()}
function openSap(){const v=$('#sapInput')?.value.trim();const x=find(v);if(!x)return toast('Référence SAP introuvable.');showItem(x.sap)}
async function startCamera(){const area=$('#camArea');try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});area.innerHTML=`<div class="camera"><video id="video" autoplay playsinline></video><div class="camcontrols"><button class="bigbtn secondary" style="margin:0" onclick="captureFrame()">📸 Capturer</button><button class="bigbtn secondary" style="margin:0" onclick="stopCamera()">Fermer</button></div><canvas id="canvas" style="display:none"></canvas></div><p class="muted small">Cadre le numéro SAP, capture l’image, puis utilise le texte de l’iPhone si nécessaire.</p>`;$('#video').srcObject=cameraStream}catch(e){area.innerHTML='<div class="empty">Caméra indisponible. Vérifie l’autorisation Safari.</div>'}}
function captureFrame(){const v=$('#video'),c=$('#canvas');if(!v||!c)return;c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const img=c.toDataURL('image/jpeg',.85);openModal(`<button class="close" onclick="closeModal()">×</button><h2>Photo du SAP</h2><img src="${img}" style="width:100%;border-radius:14px;margin:10px 0"><p class="muted small">La capture est prête. Sur iPhone, tu peux utiliser Live Text sur l’image pour copier le numéro SAP, puis le saisir dans Scanner.</p><button class="bigbtn secondary" onclick="closeModal()">Retour au scanner</button>`)}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function backup(){const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),items:state.items,moves:state.moves},null,2)],{type:'application/json'});downloadBlob(blob,'stock-sav-weiss-backup.json');toast('Sauvegarde créée.')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error();state.items=d.items.map(x=>({...x,qty:Number(x.qty)||0,threshold:Number(x.threshold)||0,unit:normUnit(x.unit)}));state.moves=Array.isArray(d.moves)?d.moves:[];save();render();toast('Sauvegarde restaurée.')}catch(_){toast('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){let s='SAP;Désignation;Quantité;Unité;Seuil\n';state.items.forEach(x=>s+=`"${x.sap.replaceAll('"','""')}";"${x.name.replaceAll('"','""')}";${String(x.qty).replace('.',',')};"${x.unit}";${String(x.threshold).replace('.',',')}\n`);downloadBlob(new Blob([s],{type:'text/csv;charset=utf-8'}),'stock-sav-weiss.csv')}
function importCSV(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const lines=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);const parsed=lines.slice(1).map(line=>{const a=line.split(';').map(v=>v.replace(/^"|"$/g,'').replaceAll('""','"'));return {sap:a[0].trim(),name:a[1].trim(),qty:parseFloat((a[2]||'0').replace(',','.'))||0,unit:normUnit(a[3]),threshold:parseFloat((a[4]||'0').replace(',','.'))||0}}).filter(x=>x.sap);if(!parsed.length)throw Error();const by=new Map(state.items.map(x=>[x.sap,x]));parsed.forEach(x=>by.set(x.sap,x));state.items=[...by.values()].sort((a,b)=>a.sap.localeCompare(b.sap));save();render();toast(`${parsed.length} référence(s) importée(s).`)}catch(_){toast('CSV invalide. Utilise le format exporté par l’application.')}};r.readAsText(f,'UTF-8')}
load();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
